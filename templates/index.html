<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABED PREDICT WORLD</title><style>body{background:#0f141e;color:#e2e8f0;font-family:sans-serif;margin:0}.h{background:#0b101a;padding:14px;position:sticky;top:0;z-index:9;border-bottom:1px solid #2a3650}.badge{background:#22c55e;color:#000;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800}.card{background:#1b2333;border:1px solid #2a3650;border-radius:12px;padding:12px;margin:10px}.cat{color:#22c55e;font-weight:800;margin:14px 4px 6px;font-size:12px;letter-spacing:1px}.row{padding:12px 0;border-bottom:1px solid #1f2a3d;display:flex;justify-content:space-between;font-size:13px;color:#e2e8f0;text-decoration:none}.row:hover{background:#243047}</style></head><body><div class=h><h2 style=margin:0>ABED PREDICT <span style=color:#22c55e>WORLD</span> <span class=badge>LIVE 100+ LEAGUES</span></h2><div style=font-size:11px;color:#94a3b8>Spain • Greece • Sweden • Americas • Africa • Europe • Asia + Cups + Amateur</div></div>{% for cat, leagues in cats.items() %}<div class=card><div class=cat>{{cat}}</div>{% for l in leagues %}<a class=row href="/league/{{l.id}}"><span>{{l.n}}</span><span style=color:#22c55e>{{l.f}} -></span></a>{% endfor %}</div>{% endfor %}</body></html>
