<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABED PREDICT WORLD</title><style>body{background:#0f141e;color:#e2e8f0;font-family:sans-serif;margin:0}.h{background:#0b101a;padding:14px;position:sticky;top:0;z-index:9;border-bottom:1px solid #2a3650}.badge{background:#22c55e;color:#000;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800}.card{background:#1b2333;border:1px solid #2a3650;border-radius:12px;padding:12px;margin:10px}.country{color:#fbbf24;font-weight:900;margin:14px 4px 8px;font-size:14px;letter-spacing:1px;border-bottom:1px solid #2a3650;padding-bottom:6px}.row{padding:11px 0;border-bottom:1px solid #1f2a3d;display:flex;justify-content:space-between;font-size:13px;color:#e2e8f0;text-decoration:none}.row:hover{background:#243047}.type{font-size:10px;padding:2px 6px;border-radius:6px}.PRO{background:#1f3a2e;color:#22c55e}.AMATEUR{background:#3a2e1f;color:#fbbf24}.CUP{background:#2e2a3a;color:#a78bfa}</style></head><body><div class=h><h2 style=margin:0>ABED PREDICT <span style=color:#22c55e>WORLD</span> <span class=badge>COUNTRY VIEW</span></h2><div style=font-size:11px;color:#94a3b8>Tap country → Pro / Amateur / Cup under it</div></div>{% for country, leagues in countries.items() %}<div class=card><div class=country>🌍 {{country}}</div>{% for l in leagues %}<a class=row href="/league/{{l.id}}"><span>{{l.n}} <span class="type {{l.type}}">{{l.type}}</span></span><span style=color:#22c55e>{{l.games|length}} games -></span></a>{% endfor %}</div>{% endfor %}</body></html>
