<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#0e1a2f;color:#fff;font-family:sans-serif;margin:0}
.top{padding:12px;background:#132040;border-bottom:1px solid #1e3354}
.back{color:#22c55e;text-decoration:none;font-weight:700}
.title{font-size:18px;font-weight:800;margin-top:8px}
.row{display:flex;justify-content:space-between;padding:14px;background:#1a2c4a;border-bottom:1px solid #1e3354;color:#fff;text-decoration:none}
.sec{background:#0c1830;padding:8px 14px;font-weight:800;font-size:11px;border-bottom:1px solid #1e3354}
</style></head><body>
<div class="top"><a href="/" class="back">← Back</a><div class="title">{{ lg.n }}</div></div>
<div class="sec">MATCHES</div>
{% for g in games %}
<a class="row" href="/game/{{ g.id }}"><span>{{ g.home }}</span><span style="color:#8da0bf">{{ g.time }} ›</span></a>
{% endfor %}
{% if not games %}<div style="padding:30px;text-align:center;color:#8da0bf">No fixtures</div>{% endif %}
</body></html>
