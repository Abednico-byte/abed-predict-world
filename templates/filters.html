<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filters</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0e1625;color:#cbd5e1;font-family:sans-serif}
.top{background:#111c2e;padding:14px;display:flex;gap:10px}.t{font-size:18px;font-weight:800;color:#fff}.s{font-size:11px;color:#8da0bf}
.chips{display:flex;gap:8px;padding:0 12px 12px;overflow:auto}.chip{padding:6px 12px;border-radius:16px;background:#1a2538;color:#8da0bf;font-size:12px;border:1px solid #1f2e4a;white-space:nowrap;cursor:pointer}.chip.active{background:#1f3d2e;color:#22c55e;border-color:#22c55e;font-weight:700}
.card{background:#1a2538;border:1px solid #1f2e4a;border-radius:14px;margin:12px;padding:14px}.ct{font-weight:800;color:#fff;font-size:13px}.cd{font-size:11px;color:#8da0bf;margin-top:2px}
.r{display:flex;justify-content:space-between;font-size:11px;margin-top:7px}.b{font-size:9px;padding:2px 6px;border-radius:4px;background:#0f172a;color:#94a3b8;font-weight:700}.v{font-weight:800}
.cnt{font-size:11px;color:#64748b;margin-top:10px}.un{width:100%;margin-top:10px;background:#232f45;color:#94a3b8;padding:11px;border-radius:20px;text-align:center;font-weight:700}
.hide{display:none}
</style></head><body>
<div class="top"><div><div class="t">Filters</div><div class="s">Cut the full fixture list down to the handful of games that match your angle.</div></div><div style="margin-left:auto" onclick="location.href='/'">✕</div></div>
<div class="chips"><div class="chip" data-c="All" onclick="setChip(this)">All</div><div class="chip active" data-c="Probability" onclick="setChip(this)">Probability</div><div class="chip" data-c="Value" onclick="setChip(this)">Value</div></div>
<div id="list"></div>
<div style="height:80px"></div>
<script>
const presets=[
 {cat:"Probability",icon:"🏠",title:"HOME BANKERS",desc:"The model likes the home side, they win at this ground, and they are on a run.",f:[["MODEL","Home Win","70%+"],["MODEL","League Predictability","Good"],["HOME","Win % home","55%+"],["HOME","Win % last 5 - home","60%+"]],c:"35 matches"},
 {cat:"Probability",icon:"🎯",title:"BTTS & WIN",desc:"The model has the home side winning and both teams scoring.",f:[["MODEL","Home Win","55%+"],["MODEL","BTTS","55%+"],["HOME","Scored +0.5 % home","80%+"],["AWAY","Scored +0.5 % last 6 - away","65%+"]],c:"64 matches"},
 {cat:"Probability",icon:"✈️",title:"AWAY EDGE",desc:"Travelling sides the model rates above the home team.",f:[["MODEL","Away Win","50%+"],["MODEL","Home Win","Under 30%"],["AWAY","Win % last 10 - away","40%+"],["HOME","Win % last 5 - home","Under 45%"]],c:"74 matches"},
 {cat:"Probability",icon:"⚽",title:"GOAL RUSH",desc:"The model wants overs and BTTS.",f:[["MODEL","+2.5 Goals","62%+"],["MODEL","BTTS","55%+"],["HOME","+2.5 Goals % last 10","60%+"],["AWAY","BTTS % last 6","55%+"]],c:"173 matches"},
 {cat:"Probability",icon:"🛡️",title:"TIGHT GAMES",desc:"The model expects two goals or fewer.",f:[["MODEL","-2.5 Goals","62%+"],["MODEL","BTTS","Under 42%"],["HOME","+2.5 Goals %","Under 48%"]],c:"29 matches"},
 {cat:"Value",icon:"💰",title:"HOME VALUE",desc:"Home win prices 1.90-3.20 longer than model.",f:[["ODDS","Home Win","1.9 - 3.2"],["VALUE","Value Only Mode","On"]],c:"96 matches"},
 {cat:"Value",icon:"💸",title:"AWAY VALUE",desc:"Away prices 2.60-6.00 longer than model.",f:[["ODDS","Away Win","2.6 - 6"],["VALUE","Value Only Mode","On"]],c:"147 matches"},
];
function render(cat){let h="";presets.forEach(p=>{if(cat!=="All"&&p.cat!==cat)return;h+=`<div class="card" data-cat="${p.cat}"><div style="display:flex;gap:10px"><div>${p.icon}</div><div><div class="ct">${p.title}</div><div class="cd">${p.desc}</div></div></div>`;p.f.forEach(f=>{h+=`<div class="r"><div><span class="b">${f[0]}</span> ${f[1]}</div><div class="v">${f[2]}</div></div>`});h+=`<div class="cnt">${p.c} in the next 24 hours</div><div class="un">🔓 Unlock ⚙️</div></div>`});document.getElementById('list').innerHTML=h;}
function setChip(el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render(el.dataset.c);}
render('Probability');
</script>
</body></html>
